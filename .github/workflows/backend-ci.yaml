name: Backend CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      CFLAGS: "-Wno-error=incompatible-pointer-types -Wno-error=implicit-function-declaration"
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install pipenv
      - run: pipenv install --dev
      - run: pipenv run lint

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      CFLAGS: "-Wno-error=incompatible-pointer-types -Wno-error=implicit-function-declaration"
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install pipenv
      - run: pipenv install --dev
      - run: pipenv run test

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      CFLAGS: "-Wno-error=incompatible-pointer-types -Wno-error=implicit-function-declaration"
    steps:
      - uses: actions/checkout@v3
      - run: docker build -t mp-backend:latest .