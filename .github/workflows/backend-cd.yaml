name: Backend CD

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/**'

env:
  AWS_REGION: us-east-1

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      CFLAGS: "-Wno-error=incompatible-pointer-types -Wno-error=implicit-function-declaration"
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install pipenv
      - run: pipenv install --dev
      - run: pipenv run lint

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      CFLAGS: "-Wno-error=incompatible-pointer-types -Wno-error=implicit-function-declaration"
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install pipenv
      - run: pipenv install --dev
      - run: pipenv run test

  build-and-push:
    needs: [lint, test]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      CFLAGS: "-Wno-error=incompatible-pointer-types -Wno-error=implicit-function-declaration"
    outputs:
      image_uri: ${{ steps.set-image.outputs.image_uri }}
    steps:
      - uses: actions/checkout@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login
      - run: |
          docker build -t ${{ steps.ecr-login.outputs.registry }}/backend:${{ github.sha }} .
          docker push ${{ steps.ecr-login.outputs.registry }}/backend:${{ github.sha }}
      - id: set-image
        run: echo "image_uri=${{ steps.ecr-login.outputs.registry }}/backend:${{ github.sha }}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/k8s
    steps:
      - uses: actions/checkout@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - run: aws eks update-kubeconfig --name cluster --region ${{ env.AWS_REGION }}
      - run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          ./kustomize edit set image backend=${{ needs.build-and-push.outputs.image_uri }}
          ./kustomize build . | kubectl apply -f -
